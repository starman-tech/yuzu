name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - name: Vérifications
        run: tools/lint.sh
      - name: Installateur
        run: bash -n install.sh && bash -n tools/nested.sh && bash -n tools/build.sh
      - name: Catalogue (modules embarqués dans l'édition EGO)
        run: git clone --depth 1 https://github.com/starman-tech/sidepanel-modules ../sidepanel-modules
      - name: Zips
        run: tools/build.sh && tools/build.sh --ego
      - uses: actions/upload-artifact@v4
        with:
          name: sidepanel-zips
          path: |
            dist/*.zip
            dist/ego/*.zip
